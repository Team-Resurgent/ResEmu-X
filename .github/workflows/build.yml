name: Build

# Simple CI for the Team-Resurgent fork: build the Windows, Linux and macOS
# executables on every push to teamresurgent and publish them as a rolling
# "latest" prerelease.

on:
  push:
    branches: [teamresurgent]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'COPYING'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xemu-project/xemu-win64-toolchain-gcc:sha-2881edd
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: /tmp/xemu-ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-win64-${{ github.sha }}
          restore-keys: ccache-win64-
      - name: Build
        run: ./build.sh -p win64-cross
      - name: Package
        run: cd dist && zip -r ../xemu-win64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: xemu-win64
          path: xemu-win64.zip

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: /tmp/xemu-ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get -qy update
          sudo apt-get -qy install \
            build-essential ccache git cmake ninja-build zip \
            python3 python3-pip python3-venv python3-tomli python3-yaml \
            libepoxy-dev libpixman-1-dev libsdl2-dev libsamplerate0-dev \
            zlib1g-dev libssl-dev libpcap-dev libslirp-dev libvulkan-dev \
            libusb-1.0-0-dev libcurl4-gnutls-dev libpipewire-0.3-dev libfuse2
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Build
        run: ./build.sh
      - name: Package
        run: cd dist && zip -r ../xemu-linux-x86_64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: xemu-linux-x86_64
          path: xemu-linux-x86_64.zip

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      CCACHE_DIR: /tmp/xemu-ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          brew install ccache coreutils dylibbundler
          pip3 install --break-system-packages pyyaml requests \
            || pip3 install pyyaml requests
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-macos-${{ matrix.arch }}-
      - name: Build
        run: |
          export PATH="/opt/homebrew/opt/ccache/libexec:$PATH"
          ./build.sh -a ${{ matrix.arch }}
      - name: Package
        run: cd dist && zip -r ../xemu-macos-${{ matrix.arch }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: xemu-macos-${{ matrix.arch }}
          path: xemu-macos-${{ matrix.arch }}.zip

  release:
    name: Publish latest
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*.zip)
          echo "Attaching: ${files[*]}"
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest (teamresurgent)" \
            --notes "Automated build of ${GITHUB_SHA}." \
            --prerelease \
            "${files[@]}"
